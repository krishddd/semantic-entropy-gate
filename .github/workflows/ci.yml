name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "ruff==0.15.15"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest --cov=semantic_entropy_gate --cov-report=term-missing -q

  smoke:
    name: CLI smoke test (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: sem-gate demo
        run: sem-gate demo --out /tmp/demo
      - name: sem-gate score on the bundled dataset
        run: |
          sem-gate score --input data/demo.jsonl --entailment lexical --out /tmp/report --quiet
          test -s /tmp/report.json
          test -s /tmp/report.md
      - name: sem-gate explain
        run: sem-gate explain --json /tmp/report.json --index 0
      - name: Run the examples
        run: |
          python examples/quickstart.py
          python examples/gate_an_agent.py
          python examples/calibrate_threshold.py
          python examples/refusal_aware_gate.py
          python examples/production_agent.py
      - name: doctor validates task separation on a labelled dev set
        run: |
          sem-gate doctor --entailment lexical --allow-triage --dev-set data/demo.jsonl | tee /tmp/doctor.out
          grep -q "task separation" /tmp/doctor.out
          grep -q "AUROC" /tmp/doctor.out
      - name: sem-gate doctor rejects a triage backend (exit code 1)
        run: |
          set +e
          sem-gate doctor --entailment lexical --threshold 0.55
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
          echo "doctor correctly refused to certify the triage backend"
      - name: A non-answer must not open the gate (exit code 2 == not allowed)
        run: |
          set +e
          sem-gate gate "Who was CEO of Helix Ltd in 2015?" \
            --entailment lexical \
            --samples "I don't know." \
            --samples "I do not know." \
            --samples "I don't know" \
            --samples "I don't know!"
          code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }
          echo "non-answer correctly refused"

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, test, smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check artifacts
        run: ls -l dist
      - name: Install the built wheel in a clean env and import it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/python -c "import semantic_entropy_gate as s; print(s.__version__)"
          /tmp/venv/bin/sem-gate demo > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
