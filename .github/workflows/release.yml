name: Publish to PyPI

# Publishes the package whenever a GitHub Release is published (or on manual
# dispatch). Authentication is via PyPI Trusted Publishing (OIDC) — no API token
# is stored in the repo. Configure the trusted publisher once on PyPI:
#   https://pypi.org/manage/account/publishing/
#   Project: semantic-entropy-gate
#   Owner:   krishddd
#   Repo:    semantic-entropy-gate
#   Workflow: release.yml
#   Environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Validate metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
